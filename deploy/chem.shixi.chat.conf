limit_conn_zone $server_name zone=chem_latex_live_connections:1m;

server {
    listen 80;
    listen [::]:80;
    server_name chem.shixi.chat;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / { return 301 https://chem.shixi.chat$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chem.shixi.chat;

    ssl_certificate /etc/letsencrypt/live/chem.shixi.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chem.shixi.chat/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 21m;
    client_body_timeout 20s;
    limit_conn chem_latex_live_connections 16;
    limit_conn_status 429;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
